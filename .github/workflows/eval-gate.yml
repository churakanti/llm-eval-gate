name: eval-gate

# Runs on every pull request and every push to main.
# Job 1 (unit-tests): fast checks of the pipeline code itself, no model needed.
# Job 2 (llm-eval-gate): runs the golden set against a free local model (Ollama)
#   and FAILS if quality is below threshold or regressed vs the committed baseline.
#   Make this job a "required status check" on main to block merges ("deployments").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # lets the job post/update the eval summary comment on the PR

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_MODEL: qwen2.5:1.5b
  PYTHON_VERSION: "3.11"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Smoke run (mock provider)
        run: python -m evalgate run --provider mock --output-dir reports/mock --quiet

  llm-eval-gate:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Cache Ollama model weights
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          # The installer may start a system service that stores models elsewhere; use our own
          # server so models live in ~/.ollama/models (the cached path).
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && echo "Ollama is up" && exit 0
            sleep 2
          done
          echo "Ollama did not start"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Run eval suite
        id: eval
        env:
          EVAL_PROVIDER: ollama
        run: |
          set +e
          python -m evalgate run --output-dir reports
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish job summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            reports/
            ollama.log
          retention-days: 30

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/summary.md')) return;
            const body = fs.readFileSync('reports/summary.md', 'utf8');
            const marker = '<!-- evalgate-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce gate
        run: |
          code="${{ steps.eval.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::Eval gate failed (exit code $code). See the PR comment or eval-report artifact."
            exit 1
          fi
          echo "Eval gate passed."
